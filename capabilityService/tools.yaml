# ============================================================
# 远程 MCP 工具：配置服务端点 URL 和认证信息
# auth.type: 认证类型（bearer / api_key / none）
# auth.token_env: 从环境变量读取认证令牌的变量名
# max_retries: 连接失败最大重试次数
# ============================================================
remote_mcp: []
