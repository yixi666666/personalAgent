# ============================================================
# 工具服务 (CapabilityService) 工具配置
# ============================================================

# ============================================================
# 自研工具：声明名称和处理函数映射，直接在 Python 代码内实现
# handler 为类的完整限定路径（模块.类名），类需提供 name/description/parameters/execute 属性
# ============================================================
internal_tools:
  - name: date_info
    handler: capabilityService.tools.date_info.DateInfoTool
  - name: rag_search
    handler: capabilityService.tools.rag_search.RagSearchTool
  - name: todo_write
    handler: capabilityService.tools.todo_write.TodoWriteTool

# ============================================================
# 本地 MCP 工具：配置启动命令和参数，工具服务以子进程方式管理
# transport: stdio（标准输入输出）或 sse（HTTP+SSE，需额外配置 url）
# env: 传递给子进程的环境变量
# workdir: 子进程工作目录（仅 sse 传输生效）
# retry: 重试策略，进程异常退出时自动重启
# ============================================================
local_mcp:
  - name: web-search
    command: mcp-web-search
    args: []
    transport: stdio
    env:
      DEFAULT_SEARCH_PROVIDER: duckduckgo
    retry:
      max_attempts: 3
      delay_seconds: 5

