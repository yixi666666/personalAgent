# RagBase 配置文件

server:
  host: "0.0.0.0"
  port: 8004

embedding:
  model_name: "./model_cache/bge-small-zh-v1.5"

chunking:
  chunk_size: 500
  chunk_overlap: 100
  separators:
    - "\n\n"
    - "\n"
    - "。"
    - "，"
    - " "

# Weaviate 向量数据库配置
weaviate:
  url: "http://localhost:8080"
  class_name: "Chunk"
  distance: "cosine"
  ef_construction: 100
  max_connections: 16

# 本地 OSS 模拟（后续替换为真 OSS 时只需修改 oss.py 实现）
local_oss:
  root: "./local_oss"

upload:
  max_memory_size: 1048576  # 1MB，超过此大小先保存到临时文件
  temp_directory: "./temp_uploads"
  allowed_extensions:
    - ".txt"
    - ".md"
  token: "@format {env[RAGBASE_UPLOAD_TOKEN]}"

llm:
  default: "spark"  # spark 或 local
  spark:
    base_url: "https://maas-api.cn-huabei-1.xf-yun.com/v2"
    model: "xop3qwen1b7"
    api_key: "@format {env[SPARK_API_KEY]}"
  local:
    base_url: "http://localhost:8000/v1"
    model: "Arch-Agent-3B"

search:
  top_k: 5
  hybrid_alpha: 0.5  # 0=纯BM25关键词, 1=纯向量, 0.5=混合（默认）
