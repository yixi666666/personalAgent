server:
  host: "0.0.0.0"
  port: 8002

agent:
  max_tool_rounds: 10

database:
  path: "./data/chatAgent.sqlite"
  echo: false

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)-20s - %(levelname)s - %(message)s"

capabilityservice:
  url: "http://localhost:8003"
  refresh_interval: 300
  call_timeout: 60